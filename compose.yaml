name: velvet

services:
  velvet:
    build:
      context: .
      dockerfile: Dockerfile
    image: velvet-ai-companion:local
    container_name: velvet
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: false
    ports:
      - "${VELVET_PORT:-3088}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-5-mini}"
      SITE_URL: "${SITE_URL:-http://localhost:3088}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
